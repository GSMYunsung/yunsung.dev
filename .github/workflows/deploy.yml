name: Deploy Website

on:
  push:
    branches:
      - main # main 브랜치에 푸시될 때만 실행

jobs:
  deploy:
    runs-on: ubuntu-latest # 깃허브가 제공하는 리눅스 가상머신에서 실행
    steps:
      - name: Checkout
        uses: actions/checkout@v4 # 내 저장소 코드를 가상머신으로 가져옴

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with: # Secrets에 넣어둔 값으로 AWS 인증
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      - name: Install modules
        run: npm ci # package-lock 기준으로 정확히 설치

      - name: Build application
        run: npm run build # dist/ 생성

      - name: Deploy to S3
        run: aws s3 sync --delete ./dist/ s3://${{ secrets.BUCKET_ID }}
        # sync: 바뀐 파일만 올림 / --delete: S3에만 남은 옛 파일 삭제

      - name: Create CloudFront invalidation
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.DISTRIBUTION_ID }} --paths "/*"
        # 캐시 무효화: CDN이 옛 버전을 계속 보여주지 않게 강제로 갱신
